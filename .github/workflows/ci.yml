name: CI

"on":
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test-linux:
    name: Linux / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install "numpy>=1.26,<3"

      - name: Configure
        run: >-
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_DNG_VALIDATE=OFF

      - name: Build native extension
        run: cmake --build build --target _native --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"

      - name: Run regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}/build/python
        run: python -m unittest discover -s tests -v

  test-windows:
    name: Windows / Python 3.12
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install test dependencies
        run: python -m pip install "numpy>=1.26,<3"

      - name: Configure
        run: >-
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_DNG_VALIDATE=OFF

      - name: Build native extension
        run: cmake --build build --target _native --parallel $env:CMAKE_BUILD_PARALLEL_LEVEL

      - name: Run regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}\build\python
        run: python -m unittest discover -s tests -v
