# Build wheels (Linux + Windows, Python 3.10) and sdist; artifact upload; publish .whl to GitHub Packages on main/master (non-PR).
name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  actions: write

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  linux-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            python3-dev

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build sdist and wheel
        run: python -m build --wheel --sdist

      - name: List built packages
        run: ls -lah dist/

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pydng-dist-linux-py310
          path: dist/*
          if-no-files-found: error

  # Windows: MSVC via ilammy/msvc-dev-cmd so CMake/pybind find cl.exe (libjpeg sources + libjxl ExternalProject).
  windows-wheel:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Enable long paths
        shell: bash
        run: git config --global core.longpaths true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: MSVC environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build wheel
        run: python -m build --wheel
        env:
          CMAKE_GENERATOR: Visual Studio 17 2022
          CMAKE_GENERATOR_PLATFORM: x64

      - name: List built wheel
        shell: bash
        run: ls -la dist/

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: pydng-dist-windows-py310
          path: dist/*.whl
          if-no-files-found: error

  # PyPI-compatible GitHub Packages registry: publish merged wheels from Linux + Windows builds.
  publish-github-packages:
    name: Publish to GitHub Packages
    needs: [linux-wheel, windows-wheel]
    runs-on: ubuntu-latest
    if: |
      success() &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master' ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'release')
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: pydng-dist-*
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install twine
        run: |
          python -m pip install --upgrade pip
          python -m pip install twine

      - name: Publish to GitHub Packages
        env:
          TWINE_USERNAME: ${{ github.repository_owner }}
          TWINE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: >
          twine upload
          --repository-url "https://pypi.pkg.github.com/${{ github.repository }}"
          --non-interactive
          --skip-existing
          dist/*.whl
