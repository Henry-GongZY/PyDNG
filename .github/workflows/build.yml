# Windows: core on MSVC host → wheels (cibuildwheel).
# Linux: core once inside manylinux2014 (matches wheel ABI) → wheels reuse prebuilt_dng (no full cmake in before-all).
name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Same image family cibuildwheel uses for broad manylinux2014_x86_64 wheels.
  MANYLINUX_IMAGE: quay.io/pypa/manylinux2014_x86_64

jobs:
  build-core-windows:
    name: Build Core (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: MSVC environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure and Build
        shell: bash
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DBUILD_DNG_VALIDATE=OFF \
            -DCMAKE_INSTALL_PREFIX=install_dir
          cmake --build build --target install --parallel "${CMAKE_BUILD_PARALLEL_LEVEL}"

      - name: Upload Core Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dng-core-windows
          path: install_dir

  # Host Ubuntu cannot produce manylinux-compliant libdng; build core once in the same manylinux image used for wheels.
  build-core-manylinux:
    name: Build Core (manylinux2014)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build & install core in manylinux container
        run: |
          set -eux
          JOBS="${CMAKE_BUILD_PARALLEL_LEVEL}"
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/project" \
            -w /project \
            "${MANYLINUX_IMAGE}" \
            bash -lc "yum install -y libatomic epel-release && cmake -B prebuilt_build -DCMAKE_BUILD_TYPE=Release -DBUILD_PYTHON_BINDINGS=OFF -DBUILD_DNG_VALIDATE=OFF -DCMAKE_INSTALL_PREFIX=/project/prebuilt_dng && cmake --build prebuilt_build --target install --parallel ${JOBS}"

      - name: Upload Core Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dng-core-manylinux
          path: prebuilt_dng

  build-wheels-windows:
    name: Build Wheels (Windows)
    needs: [build-core-windows]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Core Artifact
        uses: actions/download-artifact@v4
        with:
          name: dng-core-windows
          path: prebuilt_dng

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22.0

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: pydng-wheels-windows
          path: ./wheelhouse/*.whl

  build-wheels-linux:
    name: Build Wheels (Linux)
    needs: [build-core-manylinux]
    runs-on: ubuntu-latest
    env:
      # Manylinux wheel containers: minimal OS deps (core comes from dng-core-manylinux artifact).
      CIBW_BEFORE_ALL: yum install -y libatomic epel-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Core Artifact
        uses: actions/download-artifact@v4
        with:
          name: dng-core-manylinux
          path: prebuilt_dng

      - name: Set up QEMU (Linux)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22.0

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: pydng-wheels-linux
          path: ./wheelhouse/*.whl

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: pydng-sdist
          path: dist/*.tar.gz

  release-assets:
    name: Upload to GitHub Release
    needs: [build-wheels-windows, build-wheels-linux, build-sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: pydng-*
          merge-multiple: true

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*

  publish-to-pypi:
    name: Publish to PyPI
    needs: [build-wheels-windows, build-wheels-linux, build-sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: pydng-*
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
