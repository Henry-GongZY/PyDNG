[build-system]
requires = ["scikit-build-core>=0.11,<0.12"]
build-backend = "scikit_build_core.build"

[project]
name = "dngpy"
version = "0.1.0"
description = "Python bindings for Adobe DNG SDK"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.15.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Graphics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
]

[tool.scikit-build]
minimum-version = "0.10"
cmake.build-type = "Release"
# Default wheel.packages probes ``src/`` first; pure Python lives in ``src/pydng``.
wheel.packages = { pydng = "src/pydng" }

[tool.cibuildwheel]
# Build for Python 3.8+ as specified in [project]. Skip 32-bit builds.
skip = "*-win32 *_i686 pp* cp36* cp37* *musllinux*"
build-verbosity = "1"

# Test the built wheel
test-command = "python -c \"import pydng; print('PyDNG loaded successfully')\""

[tool.cibuildwheel.linux]
environment = { CMAKE_ARGS = "-DBUILD_DNG_LIBRARY=OFF -DPREBUILT_DNG_PATH=./prebuilt_dng" }

[tool.cibuildwheel.windows]
environment = { CMAKE_ARGS = "-DBUILD_DNG_LIBRARY=OFF -DPREBUILT_DNG_PATH=./prebuilt_dng" }
